
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Transfer Porto Seguro</title>
  <style>
    body {
      margin: 0;
      font-family: sans-serif;
      background-color: #f5c207; /* amarelo manteiga */
      color: #333;
    }
    header {
      background-color: #93c572; /* verde pistache */
      padding: 1rem;
      text-align: center;
      color: white;
    }
    main {
      padding: 2rem;
      text-align: center;
    }
    .destinos {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 1rem;
      margin-top: 2rem;
    }
    .destino {
      background: white;
      border-radius: 12px;
      overflow: hidden;
      width: 300px;
      box-shadow: 0 4px 6px rgba(0,0,0,0.1);
    }
    .destino img {
      width: 100%;
      height: 200px;
      object-fit: cover;
    }
    .destino h3 {
      margin: 0.5rem 0;
    }
    .btn-contato {
      background-color: #ffd1dc; /* rosa pastel */
      border: none;
      padding: 1rem 2rem;
      font-size: 1rem;
      cursor: pointer;
      border-radius: 8px;
      margin-top: 2rem;
    }
  </style>
</head>
<body>
  <header>
    <h1>Transfer Porto Seguro</h1>
    <p>Serviço de transporte do aeroporto ao seu hotel</p>
  </header>
  <main>
    <h2>Conheça os destinos</h2>
    <div class="destinos">
      <div class="destino">
        <img src="trancoso.jpg" alt="Trancoso">
        <h3>Trancoso</h3>
      </div>
      <div class="destino">
        <img src="arraial.jpg" alt="Arraial d'Ajuda">
        <h3>Arraial d'Ajuda</h3>
      </div>
      <div class="destino">
        <img src="caraiva.jpg" alt="Caraíva">
        <h3>Caraíva</h3>
      </div>
    </div>
    <a href="https://wa.me/5573988036301">
      <button class="btn-contato">Fale conosco no WhatsApp</button>
    </a>
  </main>
</body>
</html>
